[[items]]
title = "基于 DiT 的免反演视频编辑研究"
subtitle = "媒体融合与传播国家重点实验室"
date = "2024.09 - 至今"
content = "围绕 FlowEdit 等 inversion-free 视频编辑模式中的定位漂移与幅值衰减问题，设计空间感知注意力优化模块（SAR）和自适应幅值调制模块（AMM），构建基于 Wan2.1 的 training-free 视频编辑框架 FlowAnchor，并搭建 Anchor-Bench 评估复杂场景下的局部视频编辑能力。"
tags = ["扩散模型", "视频编辑", "DiT", "Wan2.1"]

[[items]]
title = "基于 Kolmogorov-Arnold 网络的图像质量评价"
subtitle = "机器学习 / 无参考图像质量评价"
date = "2024.06 - 2025.05"
content = "面向传统 ML-based BIQA 中高维特征到 MOS 分数映射问题，提出 TaylorKAN，以 Taylor 多项式展开替代 B-spline，并结合 PCA 对 ResNet 特征降维及训练 pipeline 优化，在多个数据集上验证泛化能力。"
tags = ["图像质量评价", "KAN", "TaylorKAN", "BIQA"]
